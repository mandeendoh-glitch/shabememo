<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>しゃべメモ β</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171a;
    --surface: #1e2225;
    --surface-2: #262b2f;
    --line: #33383c;
    --text: #f2efe9;
    --text-dim: #8b9096;
    --amber: #ffb347;
    --amber-dim: #7a6438;
    --orange: #ff5722;
    --green: #6fcf57;
    --red: #ff6b6b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Zen Kaku Gothic New', system-ui, -apple-system, sans-serif; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  .wrap{ max-width:520px; margin:0 auto; padding:0 0 48px; min-height:100dvh; }

  header{ padding:20px 20px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(20,23,26,0.92); backdrop-filter: blur(6px); z-index:20; }
  header .eyebrow{ font-size:11px; letter-spacing:.14em; color:var(--amber); font-weight:700; }
  header h1{ margin:4px 0 2px; font-size:22px; font-weight:900; letter-spacing:.01em; }
  header .sub{ font-size:12px; color:var(--text-dim); }

  .support-warn{ margin:14px 20px 0; padding:12px 14px; border:1px solid var(--red);
    border-radius:4px; background:rgba(255,107,107,0.08); font-size:12.5px; color:var(--red); display:none; }
  .support-warn.show{ display:block; }

  .device{ margin:18px 20px 0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface); }
  .device-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--surface-2); }
  .device-head .label{ font-size:10.5px; letter-spacing:.12em; color:var(--text-dim); font-weight:700; }
  .rec-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
  .rec-dot.live{ background:var(--red); box-shadow:0 0 0 0 rgba(255,107,107,.6); animation: pulse 1.2s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(255,107,107,.55);} 70%{ box-shadow:0 0 0 8px rgba(255,107,107,0);} 100%{ box-shadow:0 0 0 0 rgba(255,107,107,0);} }

  .readout{ min-height:64px; padding:16px 14px; font-size:16px; line-height:1.55; color:var(--amber);
    background:
      repeating-linear-gradient(transparent, transparent 27px, rgba(255,179,71,0.04) 28px);
  }
  .readout .placeholder{ color:var(--amber-dim); }
  .cursor{ display:inline-block; width:7px; height:16px; background:var(--amber); margin-left:2px;
    animation: blink 1s steps(1) infinite; vertical-align:-2px; }
  @keyframes blink{ 50%{ opacity:0; } }

  .photo-row{ display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); align-items:center; }
  .photo-thumb{ width:52px; height:52px; border-radius:4px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; background:#000; }
  .photo-meta{ font-size:11.5px; color:var(--text-dim); }
  .photo-meta b{ color:var(--text); display:block; font-size:13px; margin-bottom:2px; }
  .no-photo{ font-size:12px; color:var(--text-dim); padding:14px; border-top:1px solid var(--line); }

  .controls{ display:flex; gap:10px; padding:16px 20px 0; }
  .btn{ flex:1; border:none; border-radius:6px; padding:16px 10px; font-size:14px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; font-family:inherit;
    transition: transform .08s ease, opacity .15s ease; }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:.35; pointer-events:none; }
  .btn-icon{ font-size:20px; line-height:1; }
  .btn-photo{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }
  .btn-mic{ background:var(--orange); color:#1a0e08; }
  .btn-mic.recording{ background:var(--red); color:#fff; }

  .parsed{ margin:16px 20px 0; border:1px solid var(--line); border-radius:6px; background:var(--surface); display:none; }
  .parsed.show{ display:block; }
  .parsed-head{ padding:10px 14px; font-size:10.5px; letter-spacing:.12em; color:var(--text-dim); font-weight:700;
    border-bottom:1px solid var(--line); background:var(--surface-2); }
  .field{ padding:10px 14px; border-bottom:1px solid var(--line); }
  .field:last-of-type{ border-bottom:none; }
  .field label{ display:block; font-size:10.5px; color:var(--amber); letter-spacing:.06em; margin-bottom:5px; font-weight:700; }
  .field input{ width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
    color:var(--text); padding:9px 10px; font-size:14px; font-family:inherit; }
  .field input:focus{ outline:none; border-color:var(--amber); }
  .save-row{ display:flex; gap:10px; padding:14px; }
  .btn-save{ background:var(--green); color:#0e1a08; flex:2; }
  .btn-retry{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); flex:1; }

  .section-title{ margin:28px 20px 10px; font-size:11px; letter-spacing:.12em; color:var(--text-dim); font-weight:700;
    display:flex; justify-content:space-between; align-items:center; }
  .section-title .count{ color:var(--amber); }
  .export-link{ font-size:11px; color:var(--amber); text-decoration:none; font-weight:700; letter-spacing:.04em; }
  .export-link:active{ opacity:.6; }

  .entry{ margin:0 20px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); overflow:hidden; }
  .entry-top{ display:flex; gap:10px; padding:12px 14px; }
  .entry-thumb{ width:46px; height:46px; border-radius:4px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; background:#000; }
  .entry-fields{ flex:1; min-width:0; }
  .entry-tag{ display:inline-block; font-size:10px; padding:2px 6px; border-radius:3px; margin-right:5px; margin-bottom:4px;
    background:var(--surface-2); color:var(--amber); border:1px solid var(--line); font-weight:700; }
  .entry-memo{ font-size:13.5px; line-height:1.5; }
  .entry-raw{ font-size:11px; color:var(--text-dim); padding:0 14px 12px; border-top:1px dashed var(--line); margin-top:6px; padding-top:8px; }
  .entry-del{ background:none; border:none; color:var(--text-dim); font-size:11px; padding:8px 14px; width:100%;
    border-top:1px solid var(--line); cursor:pointer; text-align:center; font-family:inherit; }

  .empty{ margin:0 20px; padding:24px; text-align:center; color:var(--text-dim); font-size:12.5px;
    border:1px dashed var(--line); border-radius:6px; }

  input[type=file]{ display:none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">FIELD VOICE MEMO — BETA TEST BUILD</div>
    <h1>しゃべメモ β</h1>
    <div class="sub">撮って→喋る。認識精度の実地検証用</div>
  </header>

  <div class="support-warn" id="supportWarn">
    この端末・ブラウザは音声認識(Web Speech API)に対応していない可能性があります。Android版Google Chromeでの利用を推奨します。
  </div>

  <div class="device">
    <div class="device-head">
      <span class="label">受信ログ</span>
      <span class="rec-dot" id="recDot"></span>
    </div>
    <div class="readout mono" id="readout"><span class="placeholder">写真を撮ってから、マイクボタンで喋ってください…</span></div>
    <div class="photo-row" id="photoRow" style="display:none;">
      <img class="photo-thumb" id="photoThumb" alt="撮影写真">
      <div class="photo-meta">
        <b id="photoName">photo.jpg</b>
        <span id="photoTime">--:--:--</span>
      </div>
    </div>
    <div class="no-photo" id="noPhotoMsg">写真未選択</div>
  </div>

  <div class="controls">
    <button class="btn btn-photo" id="btnPhoto">
      <span class="btn-icon">📷</span> 写真を撮る
    </button>
    <button class="btn btn-mic" id="btnMic" disabled>
      <span class="btn-icon">🎙️</span> <span id="micLabel">メモを喋る</span>
    </button>
  </div>
  <input type="file" id="cameraInput" accept="image/*" capture="environment">

  <div class="parsed" id="parsedBox">
    <div class="parsed-head">自動分解結果 — 必要なら修正してください</div>
    <div class="field">
      <label>識別子 (番号・エリア名など)</label>
      <input type="text" id="fIdent" placeholder="例）0023 / エリアA">
    </div>
    <div class="field">
      <label>数値・状態</label>
      <input type="text" id="fNum" placeholder="例）0.3mm / 150枚">
    </div>
    <div class="field">
      <label>メモ</label>
      <input type="text" id="fMemo" placeholder="例）ひび割れ">
    </div>
    <div class="field">
      <label>認識された元テキスト（編集不可・検証用）</label>
      <input type="text" id="fRaw" readonly style="color:var(--text-dim);">
    </div>
    <div class="save-row">
      <button class="btn btn-retry" id="btnRetry">🔄 撮り直す</button>
      <button class="btn btn-save" id="btnSave">✓ 保存する</button>
    </div>
  </div>

  <div class="section-title">
    <span>記録ログ <span class="count" id="entryCount">(0)</span></span>
    <a href="#" class="export-link" id="btnExport">CSV書き出し ↓</a>
  </div>
  <div id="entryList">
    <div class="empty" id="emptyMsg">まだ記録がありません</div>
  </div>

</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  const btnPhoto = $('btnPhoto');
  const cameraInput = $('cameraInput');
  const photoThumb = $('photoThumb');
  const photoRow = $('photoRow');
  const noPhotoMsg = $('noPhotoMsg');
  const photoName = $('photoName');
  const photoTime = $('photoTime');

  const btnMic = $('btnMic');
  const micLabel = $('micLabel');
  const readout = $('readout');
  const recDot = $('recDot');
  const supportWarn = $('supportWarn');

  const parsedBox = $('parsedBox');
  const fIdent = $('fIdent'), fNum = $('fNum'), fMemo = $('fMemo'), fRaw = $('fRaw');
  const btnSave = $('btnSave'), btnRetry = $('btnRetry');

  const entryList = $('entryList');
  const emptyMsg = $('emptyMsg');
  const entryCount = $('entryCount');
  const btnExport = $('btnExport');

  let pendingPhoto = null;
  let currentRawText = '';
  let entries = [];
  let recognizing = false;

  btnPhoto.addEventListener('click', () => cameraInput.click());
  cameraInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const now = new Date();
    pendingPhoto = {
      url,
      name: file.name || 'photo.jpg',
      time: now.toLocaleTimeString('ja-JP')
    };
    photoThumb.src = url;
    photoName.textContent = pendingPhoto.name;
    photoTime.textContent = pendingPhoto.time;
    photoRow.style.display = 'flex';
    noPhotoMsg.style.display = 'none';
    btnMic.disabled = false;
    readout.innerHTML = '<span class="placeholder">マイクボタンを押して喋ってください…</span>';
    parsedBox.classList.remove('show');
  });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  if (!SR) {
    supportWarn.classList.add('show');
  } else {
    recognition = new SR();
    recognition.lang = 'ja-JP';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      recognizing = true;
      btnMic.classList.add('recording');
      micLabel.textContent = '認識中…（タップで終了）';
      recDot.classList.add('live');
      readout.innerHTML = '<span class="cursor"></span>';
    };

    recognition.onresult = (event) => {
      let interim = '', final = '';
      for (let i = 0; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t;
        else interim += t;
      }
      const combined = final + interim;
      currentRawText = final || combined;
      readout.innerHTML = escapeHtml(combined) + '<span class="cursor"></span>';
    };

    recognition.onerror = (event) => {
      readout.innerHTML = '<span class="placeholder">認識エラー（' + event.error + '）。もう一度お試しください。</span>';
      stopRecognitionUI();
    };

    recognition.onend = () => {
      stopRecognitionUI();
      if (currentRawText && currentRawText.trim()) {
        readout.innerHTML = escapeHtml(currentRawText);
        openParsed(currentRawText.trim());
      } else {
        readout.innerHTML = '<span class="placeholder">聞き取れませんでした。マイクボタンでもう一度。</span>';
      }
    };
  }

  function stopRecognitionUI(){
    recognizing = false;
    btnMic.classList.remove('recording');
    micLabel.textContent = 'メモを喋る';
    recDot.classList.remove('live');
  }

  btnMic.addEventListener('click', () => {
    if (!recognition) return;
    if (recognizing) {
      recognition.stop();
      return;
    }
    if (!pendingPhoto) return;
    currentRawText = '';
    try { recognition.start(); } catch(e) { }
  });

  function parseSpeech(text){
    let segments;
    if (text.includes('、')) segments = text.split('、');
    else if (text.includes(',')) segments = text.split(',');
    else if (text.includes(' ')) segments = text.split(/\s+/);
    else segments = [text];

    segments = segments.map(s => s.trim()).filter(Boolean);

    const numPattern = /[0-9０-９]+(\.[0-9０-９]+)?\s*(mm|cm|m|km|kg|g|枚|個|ヶ所|箇所|本|件|人|台|%)?/;

    let ident = '', numStatus = '', memo = '';

    if (segments.length >= 3) {
      ident = segments[0];
      numStatus = segments[1];
      memo = segments.slice(2).join('、');
    } else if (segments.length === 2) {
      ident = segments[0];
      const m = segments[1].match(numPattern);
      if (m && m[0].trim()) {
        numStatus = m[0].trim();
        memo = segments[1];
      } else {
        memo = segments[1];
      }
    } else if (segments.length === 1) {
      memo = segments[0];
      const m = segments[0].match(numPattern);
      if (m && m[0].trim()) numStatus = m[0].trim();
    }

    return { ident, numStatus, memo };
  }

  function openParsed(raw){
    const p = parseSpeech(raw);
    fIdent.value = p.ident;
    fNum.value = p.numStatus;
    fMemo.value = p.memo;
    fRaw.value = raw;
    parsedBox.classList.add('show');
    parsedBox.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  btnRetry.addEventListener('click', () => {
    parsedBox.classList.remove('show');
    readout.innerHTML = '<span class="placeholder">マイクボタンを押して喋ってください…</span>';
  });

  btnSave.addEventListener('click', () => {
    if (!pendingPhoto) return;
    const entry = {
      id: Date.now(),
      photoUrl: pendingPhoto.url,
      photoName: pendingPhoto.name,
      time: pendingPhoto.time,
      ident: fIdent.value.trim(),
      numStatus: fNum.value.trim(),
      memo: fMemo.value.trim(),
      raw: fRaw.value
    };
    entries.unshift(entry);
    renderEntries();

    parsedBox.classList.remove('show');
    photoRow.style.display = 'none';
    noPhotoMsg.style.display = 'block';
    pendingPhoto = null;
    btnMic.disabled = true;
    readout.innerHTML = '<span class="placeholder">写真を撮ってから、マイクボタンで喋ってください…</span>';
    cameraInput.value = '';
  });

  function renderEntries(){
    entryCount.textContent = '(' + entries.length + ')';
    if (entries.length === 0) {
      entryList.innerHTML = '';
      entryList.appendChild(emptyMsg);
      return;
    }
    entryList.innerHTML = '';
    entries.forEach(en => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <div class="entry-top">
          <img class="entry-thumb" src="${en.photoUrl}" alt="">
          <div class="entry-fields">
            ${en.ident ? `<span class="entry-tag">${escapeHtml(en.ident)}</span>` : ''}
            ${en.numStatus ? `<span class="entry-tag">${escapeHtml(en.numStatus)}</span>` : ''}
            <div class="entry-memo">${escapeHtml(en.memo || '(メモなし)')}</div>
          </div>
        </div>
        <div class="entry-raw">${en.time} ／ 元テキスト: ${escapeHtml(en.raw)}</div>
        <button class="entry-del" data-id="${en.id}">この記録を削除</button>
      `;
      entryList.appendChild(div);
    });
    entryList.querySelectorAll('.entry-del').forEach(btn => {
      btn.addEventListener('click', () => {
        entries = entries.filter(e => e.id !== Number(btn.dataset.id));
        renderEntries();
      });
    });
  }

  btnExport.addEventListener('click', (e) => {
    e.preventDefault();
    if (entries.length === 0) { alert('記録がまだありません。'); return; }
    const header = ['時刻', '識別子', '数値・状態', 'メモ', '元テキスト（認識結果）'];
    const rows = entries.map(en => [en.time, en.ident, en.numStatus, en.memo, en.raw]);
    const csv = [header, ...rows].map(r =>
      r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')
    ).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shabememo_log_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
